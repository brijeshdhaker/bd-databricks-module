# This is a Databricks asset bundle definition for bd-databricks-module.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bd-databricks-module
  uuid: 60f10c32-9334-4f7f-9b11-d829da36a85f

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # ${workspace.current_user.short_name}
    mode: development
    default: true
    workspace:
      host: https://dbc-ad78fc43-bcc0.cloud.databricks.com
    variables:
      catalog: workspace
      schema: default
  prod:
    mode: production
    workspace:
      host: https://dbc-ad78fc43-bcc0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/brijeshdhaker@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/brijeshdhaker@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: brijeshdhaker@gmail.com
        level: CAN_MANAGE

resources:
  apps:
    bd-databricks-module:
      name: bd-databricks-module
      source_code_path: .
      resources:
        - name: 'my_uc_function'
          uc_securable:
            securable_full_name: 'workspace.default.a_number'
            securable_type: 'FUNCTION'
            permission: 'EXECUTE'
        - name: 'Bakehouse Sales Starter Space'
          genie_space:
            name: 'genie_space'
            space_id: '01f09dad81ae105b9cd77cec8660f37c'
            permission: 'CAN_RUN'